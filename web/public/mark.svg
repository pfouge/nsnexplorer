           stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
  <line x1="16" y1="0.5"  x2="16" y2="4"   stroke="currentColor" stroke-width="2"/>
  <line x1="16" y1="28"   x2="16" y2="31.5" stroke="currentColor" stroke-width="2"/>
  <line x1="1"  y1="16"   x2="4.5" y2="16"  stroke="currentColor" stroke-width="2"/>
  <line x1="27.5" y1="16" x2="31" y2="16"  stroke="currentColor" stroke-width="2"/>
  <circle cx="16" cy="16" r="3.2" fill="#0E7C4D"/>
</svg>
