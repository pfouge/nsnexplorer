name: char-candidates

# One-shot: download the FLIS export and select the richest-characteristic
# NIINs in a few mechanical FSCs (gaskets/bearings/fittings/washers) so a
# real, well-specified part in a different category can be drawn. Commits
# ingest/publog/candidates.json. Touch the selector or this file to run.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'ingest/publog/select-candidates.mjs'
      - '.github/workflows/char-candidates.yml'

permissions:
  contents: write

concurrency:
  group: char-candidates
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: fetch FLIS exports
        run: node ingest/publog/fetch.mjs --out /tmp/publog --files IDENTIFICATION.zip,CHARACTERISTICS.zip
      - name: select candidates
        run: node ingest/publog/select-candidates.mjs --dir /tmp/publog
      - name: commit
        if: always()
        run: |
          git config user.name "char-bot"
          git config user.email "noreply@anthropic.com"
          git add ingest/publog/candidates.json || true
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "char: mechanical-category candidates [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          fi
