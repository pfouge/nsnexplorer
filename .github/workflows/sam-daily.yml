name: sam-daily

# SAM.gov open-solicitation lane: pulls active solicitations across every
# agency (see ingest/sam/fetch.mjs — ptype=r,o,k) into pub.solicitations
# (source='sam_gov'), alongside the DIBBS RFQ lane (rfq-fast.yml). SAM's
# search API is a much lower-churn, all-agency board compared to DIBBS's
# per-day grid, so a daily cadence is enough here.
#
# SAM_API_KEY (a free api.data.gov key) may not be configured yet. Rather
# than fail the whole pipeline while onboarding, the "check SAM_API_KEY"
# step below gates every following step on the key being present — an
# empty/missing key logs a notice and the job succeeds as a no-op instead
# of failing.

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/sam-daily.yml'
      - 'ingest/sam/**'
      - 'ingest/ledger.mjs'

concurrency:
  group: sam-daily
  cancel-in-progress: false

permissions:
  contents: write
  deployments: write

env:
  DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
  SAM_API_KEY: ${{ secrets.SAM_API_KEY }}

jobs:
  sam:
    runs-on: ubuntu-latest
    steps:
      - name: check SAM_API_KEY
        id: check-key
        run: |
          if [ -z "$SAM_API_KEY" ]; then
            echo "notice: SAM_API_KEY is not set — skipping this run (no-op) until the secret is configured."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check-key.outputs.present == 'true'
      - uses: actions/setup-node@v4
        if: steps.check-key.outputs.present == 'true'
        with:
          node-version: 22
      - run: npm ci
        if: steps.check-key.outputs.present == 'true'
      - run: bash .github/scripts/retry-pool-full.sh /tmp/migrate.log node db/migrate.mjs
        if: steps.check-key.outputs.present == 'true'
      # One posting day at a time, each checked against SAM's own count and recorded in the
      # history ledger (ops.source_dates, lane sam): the last 30 days (7 on a low-allowance key),
      # then 2 older days that are missing or incomplete, back to a year. Replaced the single
      # 30-day query on 2026-10-13, which kept only the first 1,000 notices (offset bug).
      - name: fetch + load sam notices, one day at a time
        if: steps.check-key.outputs.present == 'true'
        run: set -o pipefail; node ingest/sam/sam-dates.mjs 2>&1 | tee /tmp/sam-fetch.log
      - name: summary
        if: always()
        run: |
          { echo '### SAM.gov notices by day'; echo '```'; grep -E '^(sam-dates|Error)' /tmp/sam-fetch.log 2>/dev/null || echo 'no output'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: write run report
        if: failure() && steps.check-key.outputs.present == 'true'
        run: |
          {
            echo "at: $(date -u +%FT%TZ)  sha: $GITHUB_SHA"
            echo '== fetch log tail (errors included) =='
            if [ -s /tmp/sam-fetch.log ]; then grep -vE '^[[:space:]]+at ' /tmp/sam-fetch.log | sed -E 's/api_key=[^&[:space:]]+/api_key=***/g' | tail -60; else echo 'no fetch log: the run stopped before reading SAM.gov'; fi
            echo '== migrate log tail =='
            if [ -s /tmp/migrate.log ]; then grep -vE '^[[:space:]]+at ' /tmp/migrate.log | tail -8; else echo 'no migrate log'; fi
          } > ingest/sam/sam-last-run.txt
      - name: commit run report
        if: failure() && steps.check-key.outputs.present == 'true'
        run: |
          git config user.name "sam-bot"
          git config user.email "noreply@anthropic.com"
          git add ingest/sam/sam-last-run.txt
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "sam-daily: run report [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          fi

  sam-retry:
    needs: [sam]
    if: always() && needs.sam.result == 'failure'
    # Fresh-runner retry: a rate-limited or transient API/network failure
    # gets one more attempt on a new runner, same pattern as the DIBBS
    # lanes (rfq-fast.yml).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: bash .github/scripts/retry-pool-full.sh /tmp/migrate.log node db/migrate.mjs
      # One posting day at a time, each checked against SAM's own count and recorded in the
      # history ledger (ops.source_dates, lane sam): the last 30 days (7 on a low-allowance key),
      # then 2 older days that are missing or incomplete, back to a year. Replaced the single
      # 30-day query on 2026-10-13, which kept only the first 1,000 notices (offset bug).
      - name: fetch + load sam notices, one day at a time
        run: set -o pipefail; node ingest/sam/sam-dates.mjs 2>&1 | tee /tmp/sam-fetch.log
      - name: summary
        if: always()
        run: |
          { echo '### SAM.gov notices by day'; echo '```'; grep -E '^(sam-dates|Error)' /tmp/sam-fetch.log 2>/dev/null || echo 'no output'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: write run report
        if: failure()
        run: |
          {
            echo "at: $(date -u +%FT%TZ)  sha: $GITHUB_SHA"
            echo '== fetch log tail (errors included) =='
            if [ -s /tmp/sam-fetch.log ]; then grep -vE '^[[:space:]]+at ' /tmp/sam-fetch.log | sed -E 's/api_key=[^&[:space:]]+/api_key=***/g' | tail -60; else echo 'no fetch log: the run stopped before reading SAM.gov'; fi
            echo '== migrate log tail =='
            if [ -s /tmp/migrate.log ]; then grep -vE '^[[:space:]]+at ' /tmp/migrate.log | tail -8; else echo 'no migrate log'; fi
          } > ingest/sam/sam-last-run.txt
      - name: commit run report
        if: failure()
        run: |
          git config user.name "sam-bot"
          git config user.email "noreply@anthropic.com"
          git add ingest/sam/sam-last-run.txt
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "sam-daily: run report [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          fi

  deploy:
    needs: [sam, sam-retry]
    if: >-
      always() && (needs.sam.result == 'success'
      || needs.sam-retry.result == 'success')
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      commit_report: false
