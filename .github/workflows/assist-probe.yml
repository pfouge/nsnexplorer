name: assist-probe

# One-shot: can a US runner script ASSIST Quick Search (search -> doc
# details -> PDF)? Findings committed to ingest/assist/probe-findings.json.
# Touch this file or the probe script to dispatch. Delete once the real
# spec-document pipeline ships.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'ingest/assist/probe.mjs'
      - '.github/workflows/assist-probe.yml'

permissions:
  contents: write

concurrency:
  group: assist-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: probe
        run: node ingest/assist/probe.mjs
      - name: commit findings
        if: always()
        run: |
          git config user.name "assist-bot"
          git config user.email "noreply@anthropic.com"
          git add ingest/assist/probe-findings.json || true
          if git diff --cached --quiet; then echo "no findings"; else
            git commit -m "assist: probe findings [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          fi
