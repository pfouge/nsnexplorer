name: diagram-coverage

# Read-only report (SELECT only, READ ONLY transaction). Runs only for branches named coverage/**.
on:
  push:
    branches: ['coverage/**']

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Coverage and family samples
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          DB_POOL_MAX: '1'
        run: |
          node web/scripts/diagram-coverage.mjs --roots 5 --classes 3 --fam-samples 30 --fam-drawn --fam "THRUST@3120=THRUST;SELFALIGN@3120=SELF-ALIGNING|SPHERICAL|ROD END;SPACERPLATE@5365=^SPACER,PLATE;PLUGMT@5365=^PLUG;BUSHNM@5365=^BUSHING,(NONMETALLIC|MACHINE);WOODRUFF@5315=WOODRUFF;SETSCREW@5305=SETSCREW;ROUNDNUT@5310=ROUND;BRNUT@5310=BLIND RIVET|BARREL|SPLINE;NAILSTAPLE@5315=^NAIL|^STAPLE|^PIN,LOCK;PLUG4730@4730=^PLUG;CAP4730@4730=^CAP;NIPPLE4730@4730=^NIPPLE" | cut -c1-420
