name: rfq-award-join

# Weekly award -> RETAINED-solicitation price-join backstop, from the database only.
#
# Every DIBBS award row keeps its award-grid record in pub.contract_actions.raw, so the join can be
# re-run against today's pub.solicitations without fetching anything from DIBBS
# (ingest/dibbs/rejoin.mjs). Until 2026-10-13 this lane re-crawled 30 days of award grids every
# week (~3 h of DIBBS requests). The daily joins happen in ingest-daily (each award date as it
# loads) and in rfq-fast's back-fill (stored awards that point at newly loaded older
# solicitations); this weekly pass catches anything those miss, e.g. solicitations that arrived
# after their awards.

on:
  schedule:
    - cron: '45 9 * * 0'
  workflow_dispatch:
    inputs:
      days:
        description: 'Re-join awards with an award date in the last N days (blank = 180)'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - '.github/workflows/rfq-award-join.yml'
      - 'ingest/dibbs/rejoin.mjs'

concurrency:
  group: rfq-award-join
  cancel-in-progress: false

permissions:
  contents: write
  deployments: write

env:
  DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}

jobs:
  award-join:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: bash .github/scripts/retry-pool-full.sh /tmp/migrate.log node db/migrate.mjs
      - name: re-join stored awards against retained solicitations
        env:
          DAYS_INPUT: ${{ github.event.inputs.days }}
        run: bash .github/scripts/retry-pool-full.sh /tmp/rejoin.log node ingest/dibbs/rejoin.mjs --days "${DAYS_INPUT:-180}"
      - name: summary
        if: always()
        run: |
          { echo '### Price re-join'; echo '```'; grep -E '^rejoin.mjs' /tmp/rejoin.log || echo 'no output'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [award-join]
    if: needs.award-join.result == 'success'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      commit_report: false
