name: rfq-award-join

# Continuous award->RETAINED-solicitation price-join lane. Fetches recent
# DIBBS award-post-date grids and joins them against the PERSISTED
# pub.solicitations table (~35k retained RFQs, open + closed — see
# rfq-reconcile.yml / rfq-fast.yml) rather than a freshly-crawled RFQ set,
# so match rate — and price history — grows organically as the retained
# solicitations set ages. Offset from rfq-reconcile.yml's :15 by 30 minutes
# so the two 6-hourly lanes don't collide.

on:
  schedule:
    - cron: '45 9 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/rfq-award-join.yml'
      - 'ingest/dibbs/price-join.mjs'
      - 'ingest/dibbs/load.mjs'

concurrency:
  group: rfq-award-join
  cancel-in-progress: false

permissions:
  contents: write
  deployments: write

env:
  DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}

jobs:
  award-join:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node db/migrate.mjs
      - name: fetch award-post-date grids (30 days)
        run: node ingest/dibbs/fetch.mjs --type awd --days 30 --out /tmp/awd 2>&1 | tee /tmp/awd-fetch.log
      - name: join awards against retained solicitations + load price_points
        run: set -o pipefail; node ingest/dibbs/price-join.mjs --dir /tmp/awd 2>&1 | tee /tmp/awd-join.log
      # TEMPORARY: commit run diagnostics so results are readable over git
      # (dev container cannot reach the Actions UI). Remove with the other
      # git-report steps once dashboard access is reliable.
      - name: commit run report
        if: always()
        run: |
          {
            echo "at: $(date -u +%FT%TZ)  sha: $GITHUB_SHA"
            echo '== fetch log tail =='
            tail -20 /tmp/awd-fetch.log 2>/dev/null || echo 'no fetch log'
            echo '== join log tail =='
            tail -20 /tmp/awd-join.log 2>/dev/null || echo 'no join log'
            echo '== match/load summary =='
            grep 'price-join.mjs:' /tmp/awd-join.log 2>/dev/null || echo 'no summary line'
            echo '== fetched files =='
            ls -la /tmp/awd 2>/dev/null | head -30 || echo 'no dir'
          } > ingest/dibbs/award-join-last-run.txt
          git config user.name "dibbs-bot"
          git config user.email "noreply@anthropic.com"
          git add ingest/dibbs/award-join-last-run.txt
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "rfq-award-join: run report [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          fi

  award-join-retry:
    needs: [award-join]
    if: always() && needs.award-join.result == 'failure'
    # Fresh-runner retry: DIBBS blocks some Azure runner IPs outright, so a
    # failed fetch retries on a new runner (new IP) — same pattern as the
    # other dibbs lanes (ingest-daily.yml, rfq-reconcile.yml).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node db/migrate.mjs
      - name: fetch award-post-date grids (30 days)
        run: node ingest/dibbs/fetch.mjs --type awd --days 30 --out /tmp/awd 2>&1 | tee /tmp/awd-fetch.log
      - name: join awards against retained solicitations + load price_points
        run: set -o pipefail; node ingest/dibbs/price-join.mjs --dir /tmp/awd 2>&1 | tee /tmp/awd-join.log
      - name: commit run report
        if: always()
        run: |
          {
            echo "at: $(date -u +%FT%TZ)  sha: $GITHUB_SHA"
            echo '== fetch log tail =='
            tail -20 /tmp/awd-fetch.log 2>/dev/null || echo 'no fetch log'
            echo '== join log tail =='
            tail -20 /tmp/awd-join.log 2>/dev/null || echo 'no join log'
            echo '== match/load summary =='
            grep 'price-join.mjs:' /tmp/awd-join.log 2>/dev/null || echo 'no summary line'
            echo '== fetched files =='
            ls -la /tmp/awd 2>/dev/null | head -30 || echo 'no dir'
          } > ingest/dibbs/award-join-last-run.txt
          git config user.name "dibbs-bot"
          git config user.email "noreply@anthropic.com"
          git add ingest/dibbs/award-join-last-run.txt
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "rfq-award-join: run report [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          fi

  award-join-retry-2:
    needs: [award-join-retry]
    if: always() && needs.award-join-retry.result == 'failure'
    # Fresh-runner retry: DIBBS blocks some Azure runner IPs outright, so a
    # failed fetch retries on a new runner (new IP) — same pattern as the
    # other dibbs lanes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node db/migrate.mjs
      - name: fetch award-post-date grids (30 days)
        run: node ingest/dibbs/fetch.mjs --type awd --days 30 --out /tmp/awd 2>&1 | tee /tmp/awd-fetch.log
      - name: join awards against retained solicitations + load price_points
        run: set -o pipefail; node ingest/dibbs/price-join.mjs --dir /tmp/awd 2>&1 | tee /tmp/awd-join.log
      - name: commit run report
        if: always()
        run: |
          {
            echo "at: $(date -u +%FT%TZ)  sha: $GITHUB_SHA"
            echo '== fetch log tail =='
            tail -20 /tmp/awd-fetch.log 2>/dev/null || echo 'no fetch log'
            echo '== join log tail =='
            tail -20 /tmp/awd-join.log 2>/dev/null || echo 'no join log'
            echo '== match/load summary =='
            grep 'price-join.mjs:' /tmp/awd-join.log 2>/dev/null || echo 'no summary line'
            echo '== fetched files =='
            ls -la /tmp/awd 2>/dev/null | head -30 || echo 'no dir'
          } > ingest/dibbs/award-join-last-run.txt
          git config user.name "dibbs-bot"
          git config user.email "noreply@anthropic.com"
          git add ingest/dibbs/award-join-last-run.txt
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "rfq-award-join: run report [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          fi

  deploy:
    needs: [award-join, award-join-retry, award-join-retry-2]
    if: >-
      always() && (needs.award-join.result == 'success'
      || needs.award-join-retry.result == 'success'
      || needs.award-join-retry-2.result == 'success')
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      commit_report: false
