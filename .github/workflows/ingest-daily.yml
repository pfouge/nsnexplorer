name: ingest-daily

on:
  schedule:
    - cron: '30 8 * * *'
  workflow_dispatch: {}
  # TEMPORARY: the dev container can't dispatch workflows via the API, so
  # this push trigger lets pipeline.mjs changes get a real CI run without a
  # human manually clicking "Run workflow". Remove once dispatch access
  # exists another way.
  push:
    branches: [main]
    paths:
      - 'ingest/dibbs/pipeline.mjs'
      - 'ingest/dibbs/fetch.mjs'
      - 'ingest/dibbs/parse.mjs'
      - '.github/workflows/ingest-daily.yml'

permissions:
  contents: write

env:
  DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node db/migrate.mjs

  usaspending:
    needs: migrate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        psc: [5331]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: fetch
        run: node ingest/usaspending/fetch.mjs --psc ${{ matrix.psc }} --days 2 --out /tmp/usaspending-${{ matrix.psc }}.jsonl
      - name: load
        run: node ingest/usaspending/load.mjs --file /tmp/usaspending-${{ matrix.psc }}.jsonl --psc ${{ matrix.psc }}

  dibbs:
    needs: migrate
    # Totals-only DIBBS ingestion is live (dispatch 3, with fetch retries): award-grid rows carry total
    # contract price but no unit price, so they load as
    # pub.contract_actions (award totals), not pub.price_points. The
    # unit-price path is still gated in code — see parse.mjs's
    # LAYOUT_CONFIRMED comment and load.mjs's loadAwardRecords.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: fetch awards
        run: node ingest/dibbs/fetch.mjs --days 7 --out /tmp/dibbs-awd 2>&1 | tee /tmp/dibbs-fetch.log
      - name: parse + load awards
        run: set -o pipefail; node ingest/dibbs/pipeline.mjs --type awd --dir /tmp/dibbs-awd 2>&1 | tee /tmp/dibbs-load.log
      # TEMPORARY: commit run diagnostics so results are readable over git
      # (dev container cannot reach the Actions UI). Remove with the other
      # git-report steps once dashboard access is reliable.
      - name: commit run report
        if: always()
        run: |
          {
            echo "at: $(date -u +%FT%TZ)  sha: $GITHUB_SHA"
            echo '== fetch log tail =='
            tail -20 /tmp/dibbs-fetch.log 2>/dev/null || echo 'no fetch log'
            echo '== load log tail =='
            tail -20 /tmp/dibbs-load.log 2>/dev/null || echo 'no load log'
            echo '== fetched files =='
            ls -la /tmp/dibbs-awd 2>/dev/null | head -30 || echo 'no dir'
          } > ingest/dibbs/last-run.txt
          git config user.name "dibbs-bot"
          git config user.email "noreply@anthropic.com"
          git add ingest/dibbs/last-run.txt
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "dibbs: run report [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          fi

  dibbs-retry:
    needs: [dibbs]
    if: always() && needs.dibbs.result == 'failure'
    # Fresh-runner retry: DIBBS blocks some Azure runner IPs outright,
    # so a failed fetch retries on a new runner (new IP).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: fetch awards
        run: node ingest/dibbs/fetch.mjs --days 7 --out /tmp/dibbs-awd 2>&1 | tee /tmp/dibbs-fetch.log
      - name: parse + load awards
        run: set -o pipefail; node ingest/dibbs/pipeline.mjs --type awd --dir /tmp/dibbs-awd 2>&1 | tee /tmp/dibbs-load.log
      # TEMPORARY: commit run diagnostics so results are readable over git
      # (dev container cannot reach the Actions UI). Remove with the other
      # git-report steps once dashboard access is reliable.
      - name: commit run report
        if: always()
        run: |
          {
            echo "at: $(date -u +%FT%TZ)  sha: $GITHUB_SHA"
            echo '== fetch log tail =='
            tail -20 /tmp/dibbs-fetch.log 2>/dev/null || echo 'no fetch log'
            echo '== load log tail =='
            tail -20 /tmp/dibbs-load.log 2>/dev/null || echo 'no load log'
            echo '== fetched files =='
            ls -la /tmp/dibbs-awd 2>/dev/null | head -30 || echo 'no dir'
          } > ingest/dibbs/last-run.txt
          git config user.name "dibbs-bot"
          git config user.email "noreply@anthropic.com"
          git add ingest/dibbs/last-run.txt
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "dibbs: run report [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          fi

  dibbs-retry-2:
    needs: [dibbs-retry]
    if: always() && needs.dibbs-retry.result == 'failure'
    # Fresh-runner retry: DIBBS blocks some Azure runner IPs outright,
    # so a failed fetch retries on a new runner (new IP).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: fetch awards
        run: node ingest/dibbs/fetch.mjs --days 7 --out /tmp/dibbs-awd 2>&1 | tee /tmp/dibbs-fetch.log
      - name: parse + load awards
        run: set -o pipefail; node ingest/dibbs/pipeline.mjs --type awd --dir /tmp/dibbs-awd 2>&1 | tee /tmp/dibbs-load.log
      # TEMPORARY: commit run diagnostics so results are readable over git
      # (dev container cannot reach the Actions UI). Remove with the other
      # git-report steps once dashboard access is reliable.
      - name: commit run report
        if: always()
        run: |
          {
            echo "at: $(date -u +%FT%TZ)  sha: $GITHUB_SHA"
            echo '== fetch log tail =='
            tail -20 /tmp/dibbs-fetch.log 2>/dev/null || echo 'no fetch log'
            echo '== load log tail =='
            tail -20 /tmp/dibbs-load.log 2>/dev/null || echo 'no load log'
            echo '== fetched files =='
            ls -la /tmp/dibbs-awd 2>/dev/null | head -30 || echo 'no dir'
          } > ingest/dibbs/last-run.txt
          git config user.name "dibbs-bot"
          git config user.email "noreply@anthropic.com"
          git add ingest/dibbs/last-run.txt
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "dibbs: run report [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          fi

  scoring:
    needs: [usaspending, dibbs]
    if: always() && needs.usaspending.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node scoring/score.mjs
