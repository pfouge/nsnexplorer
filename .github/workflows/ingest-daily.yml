name: ingest-daily

on:
  schedule:
    - cron: '30 8 * * *'
  workflow_dispatch: {}
  # TEMPORARY: the dev container can't dispatch workflows via the API, so
  # this push trigger lets pipeline.mjs changes get a real CI run without a
  # human manually clicking "Run workflow". Remove once dispatch access
  # exists another way.
  push:
    branches: [main]
    paths:
      - 'ingest/dibbs/pipeline.mjs'
      - 'ingest/dibbs/fetch.mjs'
      - 'ingest/dibbs/awards-daily.mjs'
      - 'ingest/dibbs/load.mjs'
      - 'ingest/dibbs/parse.mjs'
      - '.github/workflows/ingest-daily.yml'

permissions:
  contents: write
  deployments: write

env:
  DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: bash .github/scripts/retry-pool-full.sh /tmp/migrate.log node db/migrate.mjs

  usaspending:
    needs: migrate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every class that was backfilled (see backfill.yml) must also be
        # here, or it stops updating the day the backfill finishes.
        psc: [5331, 5330]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # 120-day window, not 2: USAspending publishes DoD awards about 90
      # days after they are signed, so a 2-day window never sees them. Loads
      # are idempotent upserts, so the overlap costs nothing.
      - name: fetch
        run: node ingest/usaspending/fetch.mjs --psc ${{ matrix.psc }} --days 120 --out /tmp/usaspending-${{ matrix.psc }}.jsonl
      - name: load
        run: node ingest/usaspending/load.mjs --file /tmp/usaspending-${{ matrix.psc }}.jsonl --psc ${{ matrix.psc }}

  dibbs:
    needs: migrate
    # Totals-only DIBBS ingestion is live (dispatch 3, with fetch retries): award-grid rows carry total
    # contract price but no unit price, so they load as
    # pub.contract_actions (award totals), not pub.price_points. The
    # unit-price path is still gated in code — see parse.mjs's
    # LAYOUT_CONFIRMED comment and load.mjs's loadAwardRecords.
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # One date at a time: fetch, load award totals, join unit prices, record the date in
      # ops.dibbs_award_dates. Settled dates are skipped, so a normal day reads ~2 dates, not 7.
      # The budgets end the run cleanly before the job limit; whatever is left waits for the
      # next run. Exit 1 (a date failed) starts the fresh-runner retry below.
      - name: fetch + load awards, one date at a time
        run: set -o pipefail; node ingest/dibbs/awards-daily.mjs --days 7 --budget-min 105 --hard-budget-min 130 --out /tmp/dibbs-awd 2>&1 | tee /tmp/dibbs-fetch.log
      # TEMPORARY: commit run diagnostics so results are readable over git
      # (dev container cannot reach the Actions UI). Remove with the other
      # git-report steps once dashboard access is reliable.
      - name: commit run report
        if: always()
        run: |
          {
            echo "at: $(date -u +%FT%TZ)  sha: $GITHUB_SHA"
            echo '== dates =='
            grep -E '^awards-daily:' /tmp/dibbs-fetch.log 2>/dev/null || echo 'no awards-daily lines'
            echo '== errors and retries =='
            grep -E 'failed|retrying|Error|error' /tmp/dibbs-fetch.log 2>/dev/null | tail -20 || true
            echo '== log tail =='
            tail -5 /tmp/dibbs-fetch.log 2>/dev/null || echo 'no log'
          } > ingest/dibbs/last-run.txt
          git config user.name "dibbs-bot"
          git config user.email "noreply@anthropic.com"
          git add ingest/dibbs/last-run.txt
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "dibbs: run report [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          fi

  dibbs-retry:
    needs: [dibbs]
    # 'cancelled' too: a job that hits timeout-minutes is reported as cancelled, not failure, and
    # until 2026-10-13 that kept every retry from running.
    if: always() && (needs.dibbs.result == 'failure' || needs.dibbs.result == 'cancelled')
    # Fresh-runner retry: DIBBS blocks some Azure runner IPs outright,
    # so a failed fetch retries on a new runner (new IP).
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # One date at a time: fetch, load award totals, join unit prices, record the date in
      # ops.dibbs_award_dates. Settled dates are skipped, so a normal day reads ~2 dates, not 7.
      # The budgets end the run cleanly before the job limit; whatever is left waits for the
      # next run. Exit 1 (a date failed) starts the fresh-runner retry below.
      - name: fetch + load awards, one date at a time
        run: set -o pipefail; node ingest/dibbs/awards-daily.mjs --days 7 --budget-min 105 --hard-budget-min 130 --out /tmp/dibbs-awd 2>&1 | tee /tmp/dibbs-fetch.log
      # TEMPORARY: commit run diagnostics so results are readable over git
      # (dev container cannot reach the Actions UI). Remove with the other
      # git-report steps once dashboard access is reliable.
      - name: commit run report
        if: always()
        run: |
          {
            echo "at: $(date -u +%FT%TZ)  sha: $GITHUB_SHA"
            echo '== dates =='
            grep -E '^awards-daily:' /tmp/dibbs-fetch.log 2>/dev/null || echo 'no awards-daily lines'
            echo '== errors and retries =='
            grep -E 'failed|retrying|Error|error' /tmp/dibbs-fetch.log 2>/dev/null | tail -20 || true
            echo '== log tail =='
            tail -5 /tmp/dibbs-fetch.log 2>/dev/null || echo 'no log'
          } > ingest/dibbs/last-run.txt
          git config user.name "dibbs-bot"
          git config user.email "noreply@anthropic.com"
          git add ingest/dibbs/last-run.txt
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "dibbs: run report [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          fi

  dibbs-retry-2:
    needs: [dibbs-retry]
    if: always() && (needs.dibbs-retry.result == 'failure' || needs.dibbs-retry.result == 'cancelled')
    # Fresh-runner retry: DIBBS blocks some Azure runner IPs outright,
    # so a failed fetch retries on a new runner (new IP).
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # One date at a time: fetch, load award totals, join unit prices, record the date in
      # ops.dibbs_award_dates. Settled dates are skipped, so a normal day reads ~2 dates, not 7.
      # The budgets end the run cleanly before the job limit; whatever is left waits for the
      # next run. Exit 1 (a date failed) starts the fresh-runner retry below.
      - name: fetch + load awards, one date at a time
        run: set -o pipefail; node ingest/dibbs/awards-daily.mjs --days 7 --budget-min 105 --hard-budget-min 130 --out /tmp/dibbs-awd 2>&1 | tee /tmp/dibbs-fetch.log
      # TEMPORARY: commit run diagnostics so results are readable over git
      # (dev container cannot reach the Actions UI). Remove with the other
      # git-report steps once dashboard access is reliable.
      - name: commit run report
        if: always()
        run: |
          {
            echo "at: $(date -u +%FT%TZ)  sha: $GITHUB_SHA"
            echo '== dates =='
            grep -E '^awards-daily:' /tmp/dibbs-fetch.log 2>/dev/null || echo 'no awards-daily lines'
            echo '== errors and retries =='
            grep -E 'failed|retrying|Error|error' /tmp/dibbs-fetch.log 2>/dev/null | tail -20 || true
            echo '== log tail =='
            tail -5 /tmp/dibbs-fetch.log 2>/dev/null || echo 'no log'
          } > ingest/dibbs/last-run.txt
          git config user.name "dibbs-bot"
          git config user.email "noreply@anthropic.com"
          git add ingest/dibbs/last-run.txt
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "dibbs: run report [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          fi

  scoring:
    needs: [usaspending, dibbs]
    if: always() && needs.usaspending.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node scoring/score.mjs

  # Totals and leaderboard ranks per supplier (pub.supplier_stats) from today's price points.
  # deploy.yml refreshes them again right before its build; this keeps them current between deploys.
  stats:
    needs: [dibbs, dibbs-retry, dibbs-retry-2, scoring]
    if: >-
      always() && (needs.dibbs.result == 'success'
      || needs.dibbs-retry.result == 'success'
      || needs.dibbs-retry-2.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: refresh supplier stats
        run: bash .github/scripts/retry-pool-full.sh /tmp/supplier-stats.log node db/refresh-supplier-stats.mjs

  # Rebuild + deploy so the day's awards and prices go live (every other
  # lane already chains a deploy; this one used to wait for the next one).
  deploy:
    needs: [dibbs, dibbs-retry, dibbs-retry-2, scoring, stats]
    if: >-
      always() && (needs.dibbs.result == 'success'
      || needs.dibbs-retry.result == 'success'
      || needs.dibbs-retry-2.result == 'success')
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      commit_report: false
