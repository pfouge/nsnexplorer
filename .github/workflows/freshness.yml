name: freshness

# Daily autopilot check. Reads the database (not workflow status) to see when
# each source last landed rows and whether every row is classified, commits
# the result as freshness.json, then FAILS if anything is stale or
# misclassified — a failed scheduled run is what emails the repo owner.
# See db/freshness.mjs for the per-source limits and the invariants checked.

on:
  schedule:
    # After the day's lanes have had time to finish (they start 06:30-10:30
    # UTC and GitHub often starts scheduled runs hours late).
    - cron: '0 22 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/freshness.yml'
      - 'db/freshness.mjs'

env:
  DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}

permissions:
  contents: write

concurrency:
  group: freshness
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node db/migrate.mjs
      - name: write freshness report
        run: node db/freshness.mjs --out freshness.json --no-fail
      - name: commit report
        run: |
          git config user.name "freshness-bot"
          git config user.email "noreply@anthropic.com"
          git add freshness.json
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "freshness: daily report [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          fi
      - name: fail if any source is stale or misclassified
        run: |
          node -e "
            const r = JSON.parse(require('fs').readFileSync('freshness.json', 'utf8'));
            if (!r.ok) { console.error('STALE / FAILED: ' + r.problems.join('; ')); process.exit(1); }
            console.log('all sources current');
          "
