name: public-parents

# Public parent companies for supplier pages (migration 0026). Applies migrations, refreshes the
# parents' facts from the spotthemoney.com database when the STM_DATABASE_URL secret is set
# (read-only login), and rebuilds the supplier -> parent map from the reviewed name rules.
# Monthly, on dispatch, and when the rules or this job change.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '17 9 3 * *'
  push:
    branches: [main, 'feat/public-parents']
    paths:
      - 'db/migrations/0026_public_parents.sql'
      - 'ingest/public-parents/**'
      - '.github/workflows/public-parents.yml'

permissions:
  contents: read

env:
  DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
  STM_DATABASE_URL: ${{ secrets.STM_DATABASE_URL }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - run: bash .github/scripts/retry-pool-full.sh /tmp/migrate.log node db/migrate.mjs
      - run: node ingest/public-parents/refresh.mjs
