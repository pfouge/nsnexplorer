name: backfill-usaspending

# One-shot historical backfill: fiscal years of USAspending contract
# actions per PSC, read month by month (never before the class's history floor, see
# ingest/usaspending/history-floor.mjs), run from US-hosted GitHub runners (compliance fence:
# docs/architecture.md #3). Loads are idempotent (upserts), so re-running
# a year is safe. Dispatch manually; delete or ignore once the catalog is
# seeded — the nightly ingest-daily keeps it current from there.

on:
  workflow_dispatch:
    inputs:
      pscs:
        description: 'PSC codes to backfill (JSON array)'
        required: false
        default: '["5331","5330"]'
      fys:
        description: 'Fiscal years to backfill (JSON array)'
        required: false
        default: '["2022","2023","2024","2025","2026"]'

env:
  DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node db/migrate.mjs

  backfill:
    needs: migrate
    runs-on: ubuntu-latest
    strategy:
      # Be polite to the API: two year-jobs at a time, keep going if one
      # year fails so a single bad range doesn't kill the whole seed.
      # One at a time: two jobs asking the API for pages at once got throttled (2026-11-15).
      max-parallel: 1
      fail-fast: false
      matrix:
        psc: ${{ fromJSON(inputs.pscs) }}
        fy: ${{ fromJSON(inputs.fys) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # One month at a time: spending_by_award returns at most 10,000 awards per
      # query, and a busy class has more than that in a fiscal year (5330 has
      # about 27,000), so a whole-year window silently dropped the rest.
      - name: fetch + load FY${{ matrix.fy }} PSC ${{ matrix.psc }}, month by month
        run: |
          set -euo pipefail
          FY=${{ matrix.fy }}
          PSC=${{ matrix.psc }}
          TODAY=$(date -u +%F)
          # History floor (ingest/usaspending/history-floor.mjs): empty for 5330 and 5331 (full history),
          # 2021-10-01 for every other class. Months that start before it are not read, whatever fys says.
          FLOOR=$(node ingest/usaspending/history-floor.mjs --psc "$PSC")
          for i in $(seq 0 11); do
            START=$(date -u -d "$((FY - 1))-10-01 +$i month" +%F)
            END=$(date -u -d "$START +1 month -1 day" +%F)
            if [[ "$START" > "$TODAY" ]]; then break; fi
            if [[ "$END" > "$TODAY" ]]; then END="$TODAY"; fi
            if [[ -n "$FLOOR" && "$START" < "$FLOOR" ]]; then
              echo "month $START..$END: skipped, before the $FLOOR history floor for PSC $PSC"
              continue
            fi
            OUT="/tmp/usaspending-$PSC-$START.jsonl"
            node ingest/usaspending/fetch.mjs --psc "$PSC" --start-date "$START" --end-date "$END" --out "$OUT"
            N=$(wc -l < "$OUT")
            echo "month $START..$END: $N records"
            if [ "$N" -ge 10000 ]; then
              echo "::warning::PSC $PSC $START..$END returned $N records; the API caps a query at 10,000, so this month may be incomplete"
            fi
            node ingest/usaspending/load.mjs --file "$OUT" --psc "$PSC"
            rm -f "$OUT"
          done
      - name: row counts
        run: |
          node --input-type=module --eval "
            import pg from 'pg';
            const c = new pg.Client({ connectionString: process.env.DATABASE_URL });
            await c.connect();
            for (const t of ['pub.nsns', 'pub.contract_actions', 'pub.price_points']) {
              const r = await c.query('SELECT count(*) FROM ' + t);
              console.log(t, r.rows[0].count);
            }
            await c.end();
          "
