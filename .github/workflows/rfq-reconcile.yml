name: rfq-reconcile

# Full-window RFQ reconcile lane: recrawls the entire open-solicitation
# window and marks anything not seen as cancelled/closed (--reconcile),
# then rebuild+deploys. Runs less often than rfq-fast.yml, which only
# does expiry-only loads for near-real-time freshness.

on:
  schedule:
    - cron: '15 9 * * *'
  workflow_dispatch: {}
  # TEMPORARY: the dev container can't dispatch workflows via the API, so
  # this push trigger lets reconcile-lane changes get a real CI run without
  # a human manually clicking "Run workflow". Remove once dispatch access
  # exists another way.
  push:
    branches: [main]
    paths:
      - '.github/workflows/rfq-reconcile.yml'

# Shares the group with rfq-fast.yml so a reconcile never overlaps a fast
# crawl — they queue instead.
concurrency:
  group: rfq-reconcile
  cancel-in-progress: false

permissions:
  contents: write
  deployments: write

env:
  DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}

jobs:
  rfq:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node db/migrate.mjs
      - name: fetch rfqs
        run: node ingest/dibbs/fetch.mjs --type rfq --days 25 --out /tmp/rfq 2>&1 | tee /tmp/rfq-fetch.log
      - name: parse + load rfqs (reconcile)
        run: set -o pipefail; node ingest/dibbs/pipeline.mjs --type rfq --dir /tmp/rfq --reconcile 2>&1 | tee /tmp/rfq-load.log
      # TEMPORARY: commit run diagnostics so results are readable over git
      # (dev container cannot reach the Actions UI). Remove with the other
      # git-report steps once dashboard access is reliable. This lane is
      # infrequent enough that a commit per run is fine.
      - name: commit run report
        if: always()
        run: |
          {
            echo "at: $(date -u +%FT%TZ)  sha: $GITHUB_SHA"
            echo '== fetch log tail =='
            tail -20 /tmp/rfq-fetch.log 2>/dev/null || echo 'no fetch log'
            echo '== load log tail =='
            tail -20 /tmp/rfq-load.log 2>/dev/null || echo 'no load log'
            echo '== fetched files =='
            ls -la /tmp/rfq 2>/dev/null | head -30 || echo 'no dir'
          } > ingest/dibbs/rfq-last-run.txt
          git config user.name "dibbs-bot"
          git config user.email "noreply@anthropic.com"
          git add ingest/dibbs/rfq-last-run.txt
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "rfq-reconcile: run report [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          fi

  rfq-retry:
    needs: [rfq]
    if: always() && needs.rfq.result == 'failure'
    # Fresh-runner retry: DIBBS blocks some Azure runner IPs outright,
    # so a failed fetch retries on a new runner (new IP).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node db/migrate.mjs
      - name: fetch rfqs
        run: node ingest/dibbs/fetch.mjs --type rfq --days 25 --out /tmp/rfq 2>&1 | tee /tmp/rfq-fetch.log
      - name: parse + load rfqs (reconcile)
        run: set -o pipefail; node ingest/dibbs/pipeline.mjs --type rfq --dir /tmp/rfq --reconcile 2>&1 | tee /tmp/rfq-load.log
      - name: commit run report
        if: always()
        run: |
          {
            echo "at: $(date -u +%FT%TZ)  sha: $GITHUB_SHA"
            echo '== fetch log tail =='
            tail -20 /tmp/rfq-fetch.log 2>/dev/null || echo 'no fetch log'
            echo '== load log tail =='
            tail -20 /tmp/rfq-load.log 2>/dev/null || echo 'no load log'
            echo '== fetched files =='
            ls -la /tmp/rfq 2>/dev/null | head -30 || echo 'no dir'
          } > ingest/dibbs/rfq-last-run.txt
          git config user.name "dibbs-bot"
          git config user.email "noreply@anthropic.com"
          git add ingest/dibbs/rfq-last-run.txt
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "rfq-reconcile: run report [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          fi

  rfq-retry-2:
    needs: [rfq-retry]
    if: always() && needs.rfq-retry.result == 'failure'
    # Fresh-runner retry: DIBBS blocks some Azure runner IPs outright,
    # so a failed fetch retries on a new runner (new IP).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node db/migrate.mjs
      - name: fetch rfqs
        run: node ingest/dibbs/fetch.mjs --type rfq --days 25 --out /tmp/rfq 2>&1 | tee /tmp/rfq-fetch.log
      - name: parse + load rfqs (reconcile)
        run: set -o pipefail; node ingest/dibbs/pipeline.mjs --type rfq --dir /tmp/rfq --reconcile 2>&1 | tee /tmp/rfq-load.log
      - name: commit run report
        if: always()
        run: |
          {
            echo "at: $(date -u +%FT%TZ)  sha: $GITHUB_SHA"
            echo '== fetch log tail =='
            tail -20 /tmp/rfq-fetch.log 2>/dev/null || echo 'no fetch log'
            echo '== load log tail =='
            tail -20 /tmp/rfq-load.log 2>/dev/null || echo 'no load log'
            echo '== fetched files =='
            ls -la /tmp/rfq 2>/dev/null | head -30 || echo 'no dir'
          } > ingest/dibbs/rfq-last-run.txt
          git config user.name "dibbs-bot"
          git config user.email "noreply@anthropic.com"
          git add ingest/dibbs/rfq-last-run.txt
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "rfq-reconcile: run report [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          fi

  deploy:
    needs: [rfq, rfq-retry, rfq-retry-2]
    if: >-
      always() && (needs.rfq.result == 'success'
      || needs.rfq-retry.result == 'success'
      || needs.rfq-retry-2.result == 'success')
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      commit_report: false
