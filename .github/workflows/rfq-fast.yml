name: rfq-fast

# Near-real-time RFQ lane: crawl the open-solicitation grid, load whatever's
# new/changed (expiry-only, no full reconcile), then rebuild+deploy so new
# solicitations appear on the site within a day of DIBBS posting them.
# The full-window reconcile (cancellations etc.) runs separately on a
# slower cadence — see rfq-reconcile.yml.

on:
  schedule:
    # Daily while the site is being built out (was hourly, before that every
    # 20 min): the intraday cadences exhausted the 2,000 free Actions
    # minutes/month and, once GitHub stopped the runs, produced ~40 failure
    # emails a day. Restore an intraday schedule when the budget allows.
    - cron: '5 9 * * *'
  workflow_dispatch: {}
  # TEMPORARY: the dev container can't dispatch workflows via the API, so
  # this push trigger lets fetch/pipeline/map-rfq/load changes get a real CI
  # run without a human manually clicking "Run workflow". Remove once
  # dispatch access exists another way.
  push:
    branches: [main]
    paths:
      - '.github/workflows/rfq-fast.yml'
      - 'ingest/dibbs/fetch.mjs'
      - 'ingest/dibbs/pipeline.mjs'
      - 'ingest/dibbs/map-rfq.mjs'
      - 'ingest/dibbs/load.mjs'

# Never let two RFQ crawls run at once (fast lane and reconcile lane share
# this group) — queue them instead of overlapping.
concurrency:
  group: rfq-fast
  cancel-in-progress: false

permissions:
  contents: write
  deployments: write

env:
  DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}

jobs:
  rfq:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node db/migrate.mjs
      - name: fetch rfqs
        run: node ingest/dibbs/fetch.mjs --type rfq --days 3 --out /tmp/rfq 2>&1 | tee /tmp/rfq-fetch.log
      - name: parse + load rfqs
        run: set -o pipefail; node ingest/dibbs/pipeline.mjs --type rfq --dir /tmp/rfq 2>&1 | tee /tmp/rfq-load.log
      # No routine run-report commit here (too frequent at hourly) —
      # only write/commit a report on failure, for diagnosis over git.
      - name: write run report
        if: failure()
        run: |
          {
            echo "at: $(date -u +%FT%TZ)  sha: $GITHUB_SHA"
            echo '== fetch log tail =='
            tail -20 /tmp/rfq-fetch.log 2>/dev/null || echo 'no fetch log'
            echo '== load log tail =='
            tail -20 /tmp/rfq-load.log 2>/dev/null || echo 'no load log'
            echo '== fetched files =='
            ls -la /tmp/rfq 2>/dev/null | head -30 || echo 'no dir'
          } > ingest/dibbs/rfq-last-run.txt
      - name: commit run report
        if: failure()
        run: |
          git config user.name "dibbs-bot"
          git config user.email "noreply@anthropic.com"
          git add ingest/dibbs/rfq-last-run.txt
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "rfq-fast: run report [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          fi

  rfq-retry:
    needs: [rfq]
    if: always() && needs.rfq.result == 'failure'
    # Fresh-runner retry: DIBBS blocks some Azure runner IPs outright,
    # so a failed fetch retries on a new runner (new IP).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node db/migrate.mjs
      - name: fetch rfqs
        run: node ingest/dibbs/fetch.mjs --type rfq --days 3 --out /tmp/rfq 2>&1 | tee /tmp/rfq-fetch.log
      - name: parse + load rfqs
        run: set -o pipefail; node ingest/dibbs/pipeline.mjs --type rfq --dir /tmp/rfq 2>&1 | tee /tmp/rfq-load.log
      - name: write run report
        if: failure()
        run: |
          {
            echo "at: $(date -u +%FT%TZ)  sha: $GITHUB_SHA"
            echo '== fetch log tail =='
            tail -20 /tmp/rfq-fetch.log 2>/dev/null || echo 'no fetch log'
            echo '== load log tail =='
            tail -20 /tmp/rfq-load.log 2>/dev/null || echo 'no load log'
            echo '== fetched files =='
            ls -la /tmp/rfq 2>/dev/null | head -30 || echo 'no dir'
          } > ingest/dibbs/rfq-last-run.txt
      - name: commit run report
        if: failure()
        run: |
          git config user.name "dibbs-bot"
          git config user.email "noreply@anthropic.com"
          git add ingest/dibbs/rfq-last-run.txt
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "rfq-fast: run report [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          fi

  deploy:
    needs: [rfq, rfq-retry]
    if: >-
      always() && (needs.rfq.result == 'success'
      || needs.rfq-retry.result == 'success')
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      commit_report: false
